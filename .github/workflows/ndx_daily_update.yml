name: NDX DCA Daily Update

on:
  schedule:
    # 主: 北京时间 6:30 (UTC 22:30), 美股收盘后
    - cron: '30 22 * * 1-5'
    # 备1: 北京时间 8:30 (UTC 0:30), 兜底重试
    - cron: '30 0 * * 1-5'
    # 备2: 北京时间 12:00 (UTC 4:00), 二次兜底
    - cron: '0 4 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - 'ndx_dca/ndx_fetch_data.py'
      - 'ndx_dca/ndx_gen_data.py'
      - 'ndx_dca/ndx_build_html.py'
      - '.github/workflows/ndx_daily_update.yml'

concurrency:
  group: ndx-dca-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy requests akshare

      - name: Fetch data (with retry)
        id: fetch
        run: |
          for i in 1 2 3; do
            echo "Attempt $i..."
            if python ndx_dca/ndx_fetch_data.py; then
              echo "FETCH_OK=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Attempt $i failed, waiting 10s..."
            sleep 10
          done
          echo "FETCH_OK=false" >> $GITHUB_OUTPUT
          echo "All 3 fetch attempts failed" >&2

      - name: Generate valuation & DCA signal
        if: steps.fetch.outputs.FETCH_OK == 'true'
        run: python ndx_dca/ndx_gen_data.py

      - name: Build HTML dashboard
        if: steps.fetch.outputs.FETCH_OK == 'true'
        run: python ndx_dca/ndx_build_html.py

      - name: Build family guide
        if: steps.fetch.outputs.FETCH_OK == 'true'
        run: python ndx_dca/build_family_guide.py

      - name: Fetch CSI data
        run: python csi_dividend/csi_fetch_data.py

      - name: Generate CSI signal
        run: python csi_dividend/csi_gen_data.py

      - name: Build CSI HTML
        run: python csi_dividend/csi_build_html.py

      - name: Update version
        if: steps.fetch.outputs.FETCH_OK == 'true'
        run: |
          echo '{"version":"'"$(date -u +%Y%m%d-%H%M%S)"'","updated":"'"$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"'"}' > ndx_dca/version.json

      - name: Commit and push
        if: steps.fetch.outputs.FETCH_OK == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash
          git pull --rebase origin main || true
          git stash pop || true
          git add ndx_dca/data/ ndx_dca/ndx_dashboard.html ndx_dca/index.html ndx_dca/version.json ndx_dca/family_guide.html csi_dividend/data/ csi_dividend/csi_dashboard.html csi_dividend/index.html
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "NDX DCA Auto update $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')"
            for i in 1 2 3; do
              if git push; then exit 0; fi
              echo "Push attempt $i failed, retrying..."
              sleep 5
              git pull --rebase origin main || true
            done
            echo "Push failed after 3 attempts" >&2
            exit 1
          fi
