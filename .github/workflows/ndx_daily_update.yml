name: NDX DCA Daily Update

on:
  schedule:
    # 主: 北京时间 6:30 (UTC 22:30), 美股收盘后
    - cron: '30 22 * * 1-5'
    # 备1: 北京时间 8:30 (UTC 0:30), 兜底重试
    - cron: '30 0 * * 1-5'
    # 备2: 北京时间 12:00 (UTC 4:00), 二次兜底
    - cron: '0 4 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - 'ndx_dca/ndx_fetch_data.py'
      - 'ndx_dca/ndx_gen_data.py'
      - 'ndx_dca/ndx_build_html.py'
      - 'csi_dividend/*.py'
      - '.github/workflows/ndx_daily_update.yml'

concurrency:
  group: ndx-dca-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy requests akshare

      # NDX 和 CSI 独立抓取，互不阻断
      - name: Fetch NDX data
        continue-on-error: true
        run: python ndx_dca/ndx_fetch_data.py

      - name: Fetch CSI data
        continue-on-error: true
        run: python csi_dividend/csi_fetch_data.py

      # gen/build 无条件执行（脚本内部有防回退逻辑，数据没变化则无副作用）
      - name: Generate NDX signal
        continue-on-error: true
        run: python ndx_dca/ndx_gen_data.py

      - name: Build NDX HTML
        continue-on-error: true
        run: python ndx_dca/ndx_build_html.py

      - name: Build family guide
        continue-on-error: true
        run: python ndx_dca/build_family_guide.py

      - name: Generate CSI signal
        continue-on-error: true
        run: python csi_dividend/csi_gen_data.py

      - name: Build CSI HTML
        continue-on-error: true
        run: python csi_dividend/csi_build_html.py

      # 提交推送：无条件执行，只要有任何数据变化就提交
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A ndx_dca/ csi_dividend/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto update $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')"
          # 推送：最多重试 3 次，每次先 rebase
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "Pushed successfully"
              exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "Push failed after 3 attempts" >&2
          exit 1
