name: Hourly Dashboard Update

on:
  schedule:
    # 每小时执行（北京时间 8:00-18:00，即 UTC 0:00-10:00，周一至周五）
    - cron: '0 0-10 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - 'fetch_data.py'
      - 'gen_data.py'
      - 'build_html.py'
      - '.github/workflows/daily_update.yml'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install akshare pandas numpy
          pip install tushare || echo "tushare install failed (will use akshare only)"

      - name: Fetch latest data
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python fetch_data.py

      - name: Fetch ETF flow data
        run: python fetch_etf_flow.py

      - name: Generate JSON data
        run: python gen_data.py

      - name: Build HTML dashboard
        run: python build_html.py

      - name: Copy dashboard.html to index.html (for GitHub Pages)
        run: cp dashboard.html index.html

      - name: Update version (based on data date, not build time)
        run: |
          DATA_DATE=$(python3 -c "import json; d=json.load(open('dashboard_data.json')); print(d['date'])")
          echo "{\"version\":\"$DATA_DATE\",\"updated\":\"$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')\"}" > version.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/style_indices_v2.csv dashboard_data.json dashboard_data.js dashboard.html index.html version.json
          git diff --staged --quiet || (git commit -m "Auto update $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')" && git push)
